<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MAICA — Records</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 p-8">
  <div class="max-w-xl mx-auto">
    <h1 class="text-xl font-semibold mb-4">Records in this analysis</h1>
    {% if records %}
    <ul class="space-y-2">
      {% for source_id, record_type in records %}
      <li>
        <a class="text-blue-700 underline"
           href="/analyses/{{ analysis_id }}/records/{{ source_id }}/report">
          {{ source_id }} ({{ record_type or "unknown type" }})
        </a>
      </li>
      {% endfor %}
    </ul>
    {% else %}
    <p class="text-gray-500">No records found for this analysis.</p>
    {% endif %}
    <p class="mt-6">
      <a class="text-blue-700 underline" href="/uploads/new?analysis_id={{ analysis_id }}">
        Upload more evidence for this analysis &rarr;
      </a>
    </p>
  </div>
</body>
</html>
