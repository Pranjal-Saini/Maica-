<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MAICA — Sign in</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 p-8">
  <div class="max-w-sm mx-auto">
    <h1 class="text-xl font-semibold mb-4">Sign in to MAICA</h1>
    {% if error %}
    <p class="text-red-700 text-sm mb-4">{{ error }}</p>
    {% endif %}

    {% if google_configured %}
    <a href="/auth/google/login"
       class="flex items-center justify-center gap-2 border rounded px-4 py-2 bg-white
              hover:bg-gray-50 w-full">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.71v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.61z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.19l-2.92-2.26c-.81.54-1.85.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.98v2.33A9 9 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.97 10.71A5.4 5.4 0 0 1 3.68 9c0-.59.1-1.17.29-1.71V4.96H.98A9 9 0 0 0 0 9c0 1.45.35 2.83.98 4.04l2.99-2.33z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .98 4.96l2.99 2.33C4.68 5.16 6.66 3.58 9 3.58z"/>
      </svg>
      Continue with Google
    </a>
    {% else %}
    <p class="text-gray-500 text-sm">
      Google Sign-In is not configured on this server yet.
    </p>
    {% endif %}
  </div>
</body>
</html>
