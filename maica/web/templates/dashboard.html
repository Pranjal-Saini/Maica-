<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MAICA — Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 p-8">
  <div class="max-w-xl mx-auto">
    <div class="flex items-center justify-between mb-4">
      <h1 class="text-xl font-semibold">Your client accounts</h1>
      <form method="post" action="/logout">
        <button type="submit" class="text-sm text-gray-500 underline">Log out</button>
      </form>
    </div>
    <p class="text-sm text-gray-500 mb-4">Signed in as {{ user.name or user.email }}</p>

    {% if tenants %}
    <ul class="space-y-2">
      {% for tenant in tenants %}
      <li>
        <a class="text-blue-700 underline" href="/tenants/{{ tenant.id }}/analyses">
          {{ tenant.name }}
        </a>
      </li>
      {% endfor %}
    </ul>
    {% else %}
    <p class="text-gray-500">No client accounts yet.</p>
    {% endif %}

    <p class="mt-6">
      <a class="text-blue-700 underline" href="/tenants/new">+ Add a client account</a>
    </p>
  </div>
</body>
</html>
