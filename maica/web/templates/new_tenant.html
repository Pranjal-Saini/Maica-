<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MAICA — Add client account</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 p-8">
  <div class="max-w-sm mx-auto">
    <h1 class="text-xl font-semibold mb-4">Add a client account</h1>
    {% if error %}
    <p class="text-red-700 text-sm mb-4">{{ error }}</p>
    {% endif %}
    <form method="post" action="/tenants" class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1" for="name">Client name</label>
        <input type="text" id="name" name="name" required class="border rounded px-2 py-1 w-full" />
      </div>
      <button type="submit" class="bg-gray-900 text-white px-4 py-2 rounded">Create</button>
    </form>
    <p class="mt-4"><a class="text-blue-700 underline" href="/dashboard">&larr; Back to dashboard</a></p>
  </div>
</body>
</html>
