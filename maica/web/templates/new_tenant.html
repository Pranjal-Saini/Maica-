{% extends "base.html" %}

{% block title %}MAICA — Add client account{% endblock %}
{% block page_title %}Add a client account{% endblock %}
{% block page_subtitle %}Evidence is isolated per client account.{% endblock %}

{% block content %}
<div class="max-w-md rounded-md border border-gray-200 p-6">
  {% if error %}
  <p class="mb-4 rounded-md bg-red-50 px-3 py-2 text-sm text-red-700">{{ error }}</p>
  {% endif %}
  <form method="post" action="/tenants" class="space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
    <div>
      <label class="mb-1.5 block text-sm font-medium" for="name">Client name</label>
      <input type="text" id="name" name="name" required maxlength="120" placeholder="e.g. Acme Corp"
             class="w-full rounded-md border border-gray-200 px-3 py-2.5 text-sm
                    focus:border-ink focus:outline-none" />
    </div>
    <button type="submit"
            class="rounded-full bg-ink px-5 py-2.5 text-sm font-medium text-white hover:bg-ink/90">
      Create account
    </button>
  </form>
</div>
{% endblock %}
