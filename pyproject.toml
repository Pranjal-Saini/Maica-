[project]
name = "maica"
version = "0.1.0"
description = "NetSuite Transaction Impact Copilot — read-only diagnostic tool"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "python-multipart>=0.0.12",
    "jinja2>=3.1",
    "structlog>=24.4",
    "networkx>=3.4",
    "httpx>=0.27",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "fpdf2>=2.8.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["maica"]

# Vercel only scans for app.py / index.py / main.py / server.py / asgi.py at the
# repo root or in src/ or app/. The application lives at maica/api/main.py, so
# without this the build succeeds and every route returns 404.
[tool.vercel]
entrypoint = "maica.api.main:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults is the idiom, not a bug

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
