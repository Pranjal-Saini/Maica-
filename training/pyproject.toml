[project]
name = "maica-training"
version = "0.1.0"
description = "Dev-only tooling: synthetic dataset generation and LLM eval for MAICA's narrator model. Never shipped in the production image."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "maica",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.uv.sources]
maica = { path = "..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["synthetic", "eval"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
